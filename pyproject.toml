[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bitnet-rl"
version = "1.1.0"
description = "GRPO (DeepSeek-R1 style) reinforcement learning for BitNet b1.58 / 1-bit LLMs, with a NumPy reference and CPU validation at toy scale"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ahmad Poorgholam" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "torch>=2.2"]
keywords = [
  "bitnet", "bitnet-b1.58", "1-bit-llm", "ternary-weights", "quantization-aware-training",
  "reinforcement-learning", "grpo", "deepseek-r1", "rlvr", "policy-gradient", "llm", "pytorch",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
hf = ["transformers>=4.40"]
test = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.urls]
Homepage = "https://github.com/ahmadpoorgholam/bitnet-rl"
Repository = "https://github.com/ahmadpoorgholam/bitnet-rl"
"White paper" = "https://github.com/ahmadpoorgholam/bitnet-rl/blob/main/docs/WHITE_PAPER.md"

[project.scripts]
bitnet-rl = "bitnet_rl.train_rl:main"

[tool.setuptools]
packages = ["bitnet_rl"]
