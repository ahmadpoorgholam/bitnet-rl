name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pytest pytest-cov
      - name: Tests with coverage (CPU only)
        run: python -m pytest -q --cov=rl --cov-report=term-missing --cov-fail-under=90
      - name: NumPy-only reference (no torch import)
        run: python -m rl.numpy_ref
      - name: 3-iteration CPU perplexity check
        run: python scripts/validate_cpu.py --seeds 2 --iterations 3 --out /tmp/cpu_validation.json
